        html += '<th>Nutriente</th>';
        html += '<th>Proporción (si cumple)</th>';
        html += '<th>Porcentaje (%)</th>';
        html += '</tr></thead>';
        html += '<tbody>';

        for (var i = 0; i < datos.nutrientes.length; i++) {
            html += '<tr>';
            html += '<td>' + datos.nutrientes[i] + '</td>';
            html += '<td>' + datos.proporciones[i] + '</td>';
            html += '<td>' + datos.porcentajes[i] + '</td>';
            html += '</tr>';
        }

        html += '</tbody></table>';

        document.getElementById('tablaDiv').innerHTML = html;
    }

    // Ejecutar al cargar la página
    actualizarTabla();
</script>
