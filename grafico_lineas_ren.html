    function getColorForRendimiento(rend, index) {
        var rLower = rend.toLowerCase();
        if (rLower.includes('alto') || rLower.includes('alta')) return '#3498db'; // Azul corregido
        if (rLower.includes('medio') || rLower.includes('media')) return '#f1c40f'; // Amarillo
        if (rLower.includes('bajo') || rLower.includes('baja')) return '#e74c3c'; // Rojo corregido

        var palette = ['#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#34495e'];
        return palette[index % palette.length];
    }

    function actualizarGraficos() {
        var predio = document.getElementById('predioSelect').value;
        var especie = document.getElementById('especieSelect').value;

        var key = predio + '__' + especie;
        var datos = database[key] || database['Todos__Todas'];

        // 1. Trazas múltiples para mg/kg
        var tracesMg = [];
        datos.rendimientos.forEach((rend, index) => {
            var yVals = datos.mg_by_rend[rend] || [];
            tracesMg.push({
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Rendimiento: ' + rend,
                x: datos.mg_names,
                y: yVals,
                line: { color: getColorForRendimiento(rend, index), width: 3 },
                marker: { size: 7 }
            });
        });

        var layoutMg = {
            title: '<b>Promedio de Nutrientes (mg/kg) por Rendimiento (Predio: ' + predio + ' | Especie: ' + especie + ')</b>',
            xaxis: { title: 'Nutrientes' },
            yaxis: { title: 'Promedio (mg/kg)', zeroline: false },
            margin: { l: 60, r: 30, t: 50, b: 50 },
            legend: { orientation: 'h', y: -0.2 }
        };
        Plotly.react('chartMg', tracesMg, layoutMg);

        // 2. Trazas múltiples para meq/100g
        var tracesMeq = [];
        datos.rendimientos.forEach((rend, index) => {
            var yVals = datos.meq_by_rend[rend] || [];
            tracesMeq.push({
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Rendimiento: ' + rend,
                x: datos.meq_names,
                y: yVals,
                line: { color: getColorForRendimiento(rend, index), width: 3 },
                marker: { size: 7 }
            });
        });

        var layoutMeq = {
            title: '<b>Promedio de Intercambio Catiónico (meq/100g) por Rendimiento (Predio: ' + predio + ' | Especie: ' + especie + ')</b>',
            xaxis: { title: 'Nutrientes / Bases' },
            yaxis: { title: 'Promedio (meq/100g)', zeroline: false },
            margin: { l: 60, r: 30, t: 50, b: 50 },
            legend: { orientation: 'h', y: -0.2 }
        };
        Plotly.react('chartMeq', tracesMeq, layoutMeq);
    }

    actualizarGraficos();
