    function actualizarHeatmap() {
        var predio = document.getElementById('predioSelect').value;
        var especie = document.getElementById('especieSelect').value;
        var key = predio + '__' + especie;

        var datos = database[key] || database['Todos__Todas'];

        var trace = [{
            z: datos.z,
            x: datos.x,
            y: datos.y,
            type: 'heatmap',
            text: datos.text,
            hoverinfo: 'text',
            colorscale: 'RdBu',
            reversescale: true,
            zmin: 0,
            zmax: 100,
            colorbar: { title: 'Cumplimiento (%)' }

            },

                tickangle: -45
            },
            yaxis: {
                title: '<b>Años</b>',
                type: 'category',
                categoryorder: 'array',
                categoryarray: datos.y
            },
            margin: { l: 60, r: 40, t: 80, b: 120 }
        };

        Plotly.react('heatmapDiv', trace, layout);
    }

    actualizarHeatmap();
