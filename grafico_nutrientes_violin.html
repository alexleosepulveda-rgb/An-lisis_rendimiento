                marker: { size: 4, color: ['#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#f39c12', '#1abc9c'][i % 6] },
                line: { color: '#2c3e50' },
                meanline: { visible: true } // Muestra la línea de la media aritmética
            });
        }
        var layoutMg = {
            title: '<b>Nutrientes - Violín (mg/kg) (Predio: ' + predio + ' | Especie: ' + especie + ' | Rendimiento: ' + rendimiento + ')</b>',
            yaxis: { title: 'mg/kg', zeroline: false },
            margin: { l: 50, r: 30, t: 50, b: 40 },
            showlegend: false
        };
        Plotly.react('chartMg', tracesMg, layoutMg);

        // 2. Gráfico de Violín separado para meq/100g
        var tracesMeq = [];
        for (var j = 0; j < datos.meq_names.length; j++) {
            tracesMeq.push({
                type: 'violin',
                y: datos.meq_values[j],
                name: datos.meq_names[j],
                box: { visible: true },
                points: 'all',
                jitter: 0.35,
                pointpos: -0.8,
                marker: { size: 5, color: ['#e67e22', '#d35400', '#2980b9', '#8e44ad'][j % 4] },
                line: { color: '#34495e' },
                meanline: { visible: true }
            });
        }
        var layoutMeq = {
            title: '<b>Intercambio Catiónico - Violín (meq/100g) (Predio: ' + predio + ' | Especie: ' + especie + ' | Rendimiento: ' + rendimiento + ')</b>',
            yaxis: { title: 'meq/100g', zeroline: false },
            margin: { l: 50, r: 30, t: 50, b: 40 },
            showlegend: false
        };
        Plotly.react('chartMeq', tracesMeq, layoutMeq);
    }

    // Inicializar visualización
    actualizarGraficos();
</script>
