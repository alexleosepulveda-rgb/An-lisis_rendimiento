            width: 100%;
            height: 20px;

        .bar-fill {
            height: 100%;

        }
        .bar-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;

    // Función para interpolar color de Rojo (0%) a Azul (100%)
    function obtenerColorGradiente(pct) {
        // Si el porcentaje es 0, forzar rojo puro. Si es 100, azul puro.
        if (pct <= 0) return '#e74c3c'; // Rojo
        if (pct >= 100) return '#3498db'; // Azul

        // Interpolar linealmente entre Rojo (231, 76, 60) y Azul (52, 152, 219)
        var r = Math.round(231 - (231 - 52) * (pct / 100));
        var g = Math.round(76 - (76 - 152) * (pct / 100));
        var b = Math.round(60 - (60 - 219) * (pct / 100));
        return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function actualizarTabla() {
        var predio = document.getElementById('predioSelect').value;
        var especie = document.getElementById('especieSelect').value;
        var key = predio + '__' + especie;

        var datos = database[key] || database['Todos__Todas'];

        document.getElementById('infoTotal').innerText = 'Registros analizados: ' + datos.total_registros;

        var html = '<table class="styled-table">';
        html += '<thead><tr>';
        html += '<th>Predio</th>';
        html += '<th>Especie</th>';
        html += '<th>Nutriente / Variable Dummy</th>';
        html += '<th>Cantidad Cumple (1)</th>';
        html += '<th>Proporción</th>';
        html += '<th>Porcentaje (%)</th>';
        html += '</tr></thead>';
        html += '<tbody>';

        if (datos.nutrientes.length === 0) {
            html += '<tr><td colspan="6" style="text-align: center;">No hay variables dummy disponibles</td></tr>';
        } else {
            for (var i = 0; i < datos.nutrientes.length; i++) {
                var nut = datos.nutrientes[i];
                var count = datos.conteos[i];
                var prop = datos.proporciones[i];
                var pct = datos.porcentajes[i];
                var colorBarra = obtenerColorGradiente(pct);

                html += '<tr>';
                html += '<td>' + predio + '</td>';
                html += '<td>' + especie + '</td>';
                html += '<td><b>' + nut + '</b></td>';
                html += '<td>' + count + '</td>';
                html += '<td>' + prop.toFixed(4) + '</td>';
                html += '<td>';
                html += '<div class="bar-container">';
                html += '<div class="bar-fill" style="width: ' + pct + '%; background-color: ' + colorBarra + ';"></div>';
                html += '<div class="bar-text">' + pct + '%</div>';
                html += '</div>';
                html += '</td>';
                html += '</tr>';
            }
        }

        html += '</tbody></table>';
        document.getElementById('tablaDiv').innerHTML = html;
    }

    actualizarTabla();
</script>
